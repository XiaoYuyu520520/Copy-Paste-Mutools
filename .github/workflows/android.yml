name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: "1.25"
  APP_ID: com.xiaoyuyu.promptmerger
  # 这个值是 Android 桌面图标下显示的名字，保留中文。
  # 注意 fyne 会用它推导 .so/产物文件名（非 ASCII 会变成 _），
  # 所以收集产物时会统一改名成 prompt-merger-toolbox-android-arm64.apk。
  APP_NAME: 提示词工具箱
  APP_VERSION: "1.1.0"
  APP_BUILD: "1"
  # Fyne 2.8 对应的 NDK 版本（fyne 只依赖 NDK 做 cgo 交叉编译）
  ANDROID_NDK_VERSION: "26.1.10909125"
  ANDROID_PLATFORM: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"

jobs:
  apk:
    name: Build APK (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Fyne 的 Android 打包会调用 d8 / aapt2，需要 JDK（17 与新的 build-tools 兼容）
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub 的 ubuntu-latest 镜像自带 Android SDK（/usr/local/lib/android/sdk）。
      # 不用 android-actions/setup-android：它会去装已废弃的 "tools" 包，
      # 在 24.04 镜像上直接 exit code 1。直接用镜像里的 sdkmanager 更稳。
      - name: Configure Android SDK env
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::找不到 Android SDK（$SDK_ROOT）"
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "SDK: $SDK_ROOT"

      - name: Accept licenses and install components
        run: |
          set -euo pipefail
          sdkmanager --version
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK_VERSION}"

      - name: Export NDK env
        run: |
          set -euo pipefail
          ndk="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          if [ ! -d "$ndk" ]; then
            echo "::error::NDK 未安装：$ndk"
            exit 1
          fi
          # fyne 通过 ANDROID_NDK_HOME 定位工具链
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "NDK: $ndk"

      # 版本号从 tag 推导：v1.1.0 -> 1.1.0；主线提交用默认值
      - name: Resolve version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF#refs/tags/v}"
            echo "APP_VERSION=$ver" >> "$GITHUB_ENV"
            echo "APP_BUILD=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
            echo "版本来自 tag: $ver (build ${GITHUB_RUN_NUMBER})"
          else
            echo "APP_BUILD=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Install fyne CLI
        run: go install fyne.io/fyne/v2/cmd/fyne@v2.8.0

      - name: Build APK
        run: |
          set -euo pipefail
          # 只出 arm64：2020 年后发布的 Android 手机基本全是 arm64，
          # 单架构能把构建时间与产物体积都减半。
          # 注意：fyne v2 自带的 CLI 用驼峰风格参数（-appID / -appVersion / -appBuild），
          # 不是新工具 fyne.io/tools 的 -app-id / -app-version。
          # -icon 的路径相对于 -src 指定的包目录，而不是仓库根目录。
          fyne package \
            -os android/arm64 \
            -src ./cmd/android \
            -appID "$APP_ID" \
            -name "$APP_NAME" \
            -icon ../../ico/icon.png \
            -appVersion "$APP_VERSION" \
            -appBuild "$APP_BUILD"

      - name: Collect APK
        run: |
          set -euo pipefail
          # fyne 可能把 APK 放在包目录（cmd/android）或仓库根目录，
          # 两种情况都收进来，统一放到根目录的 dist/ 下。
          mkdir -p dist
          found=0
          while IFS= read -r -d '' apk; do
            # fyne 用包名推导文件名，非 ASCII 会被替换成 _，这里统一改名
            cp "$apk" "dist/prompt-merger-toolbox-android-arm64.apk"
            found=1
            echo "收集到 $apk"
          done < <(find . -name '*.apk' -not -path './dist/*' -print0)
          if [ "$found" -eq 0 ]; then
            echo "::error::没有找到 APK，列出工作目录排查："
            ls -la
            find . -name '*.apk' -o -name '*.aab' | head
            exit 1
          fi
          ls -lh dist
          cd dist
          sha256sum *.apk | tee SHA256SUMS-android.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prompt-merger-toolbox-android-arm64
          path: |
            dist/*.apk
            dist/SHA256SUMS-android.txt
          if-no-files-found: error

      # tag 推送时把 APK 附到同名 Release（release.yml 已先创建 Release）
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # 等 release.yml 把 Release 建出来（最多 10 分钟）
          for i in $(seq 1 60); do
            if gh release view "$tag" >/dev/null 2>&1; then break; fi
            sleep 10
          done
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.apk dist/SHA256SUMS-android.txt --clobber
          else
            echo "::warning::Release $tag 尚未创建，APK 只保留在 workflow artifact"
          fi