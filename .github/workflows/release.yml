name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: "1.25"

jobs:
  # ---------------------------------------------------------------------------
  # Windows x64（Fyne 需要 MinGW，用 MSYS2 UCRT64）
  # ---------------------------------------------------------------------------
  windows-amd64:
    name: Build windows-amd64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # path-type: inherit 才会把 MSYS2 的 bin 目录写进后续步骤的 PATH，
      # 否则 PowerShell 里找不到 gcc（Fyne 需要 cgo）。
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:CGO_ENABLED = "1"
          gcc --version | Select-Object -First 1
          go version
          New-Item -ItemType Directory -Force -Path release | Out-Null
          go build -trimpath -ldflags="-s -w -H windowsgui" -o release/merger.exe  ./cmd/merger
          go build -trimpath -ldflags="-s -w"              -o release/toolbox.exe ./cmd/toolbox
          go build -trimpath -ldflags="-s -w -H windowsgui" -o release/paint.exe   ./cmd/paint
          Get-ChildItem release

      - name: Package
        shell: pwsh
        run: |
          $targets = @("merger", "toolbox", "paint")
          foreach ($t in $targets) {
            Compress-Archive -Path "release/$t.exe" `
              -DestinationPath "release/$t-windows-amd64.zip" -Force
            Remove-Item "release/$t.exe"
          }
          Get-ChildItem release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-amd64
          path: release/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Ubuntu x86_64（原生 cgo）
  # ---------------------------------------------------------------------------
  linux-amd64:
    name: Build linux-amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc libc6-dev \
            libgl1-mesa-dev xorg-dev \
            libwayland-dev libxkbcommon-dev

      - name: Build
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          mkdir -p release
          go build -trimpath -ldflags="-s -w" -o release/merger  ./cmd/merger
          go build -trimpath -ldflags="-s -w" -o release/toolbox ./cmd/toolbox
          go build -trimpath -ldflags="-s -w" -o release/paint   ./cmd/paint
          ls -lh release

      - name: Package
        run: |
          set -euo pipefail
          cd release
          for f in merger toolbox paint; do
            tar -czf "$f-linux-amd64.tar.gz" "$f"
            rm -f "$f"
          done
          ls -lh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-amd64
          path: release/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Ubuntu ARM64（GitHub 提供的原生 arm64 runner，避免 cgo 交叉编译）
  # ---------------------------------------------------------------------------
  linux-arm64:
    name: Build linux-arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc libc6-dev \
            libgl1-mesa-dev xorg-dev \
            libwayland-dev libxkbcommon-dev

      - name: Build
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          mkdir -p release
          go build -trimpath -ldflags="-s -w" -o release/merger  ./cmd/merger
          go build -trimpath -ldflags="-s -w" -o release/toolbox ./cmd/toolbox
          go build -trimpath -ldflags="-s -w" -o release/paint   ./cmd/paint
          ls -lh release

      - name: Package
        run: |
          set -euo pipefail
          cd release
          for f in merger toolbox paint; do
            tar -czf "$f-linux-arm64.tar.gz" "$f"
            rm -f "$f"
          done
          ls -lh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-arm64
          path: release/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 汇总 + 发布
  # ---------------------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows-amd64, linux-amd64, linux-arm64]
    runs-on: ubuntu-latest
    steps:
      # gh release create 需要 git 仓库上下文（否则报
      # "failed to run git: fatal: not a git repository"），所以这里必须 checkout。
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute checksums
        working-directory: artifacts
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" artifacts/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" artifacts/* --generate-notes
          fi