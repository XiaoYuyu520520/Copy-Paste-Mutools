name: Build multi-platform

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows-amd64:
    name: Windows amd64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build
        shell: msys2 {0}
        run: |
          set -e
          export PATH="/c/Program Files/Go/bin:$PATH"
          go version
          mkdir -p release
          CGO_ENABLED=1 go build -trimpath -ldflags="-s -w -H windowsgui" \
            -o release/merger-native-windows-amd64.exe .

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path release/merger-native-windows-amd64.exe `
            -DestinationPath release/merger-native-windows-amd64.zip `
            -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: merger-native-windows-amd64
          path: release/merger-native-windows-amd64.zip
          if-no-files-found: error

  linux-amd64:
    name: Linux amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev \
            libwayland-dev libwayland-client0 libxkbcommon-dev libxrandr-dev \
            libxcursor-dev libxinerama-dev libxi-dev libxext-dev

      - name: Build and package
        run: |
          set -euo pipefail
          mkdir -p release
          CGO_ENABLED=1 go build -trimpath -ldflags="-s -w" \
            -o release/merger-native-linux-amd64 .
          tar -C release -czf release/merger-native-linux-amd64.tar.gz \
            merger-native-linux-amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: merger-native-linux-amd64
          path: release/merger-native-linux-amd64.tar.gz
          if-no-files-found: error

  macos-arm64:
    name: macOS Apple Silicon
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and package app
        run: |
          set -euo pipefail
          APP="release/Prompt Merger Native.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          CGO_ENABLED=1 GOARCH=arm64 go build -trimpath -ldflags="-s -w" \
            -o "$APP/Contents/MacOS/merger-native" .
          cp packaging/macos/Info.plist "$APP/Contents/Info.plist"
          cp ico/icon.png "$APP/Contents/Resources/icon.png"
          cp ico/default_icon.ico "$APP/Contents/Resources/icon.ico"
          chmod +x "$APP/Contents/MacOS/merger-native"
          tar -C release -czf release/merger-native-macos-arm64.tar.gz \
            "Prompt Merger Native.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: merger-native-macos-arm64
          path: release/merger-native-macos-arm64.tar.gz
          if-no-files-found: error

  macos-amd64:
    name: macOS Intel
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and package app
        run: |
          set -euo pipefail
          APP="release/Prompt Merger Native.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          CGO_ENABLED=1 GOARCH=amd64 go build -trimpath -ldflags="-s -w" \
            -o "$APP/Contents/MacOS/merger-native" .
          cp packaging/macos/Info.plist "$APP/Contents/Info.plist"
          cp ico/icon.png "$APP/Contents/Resources/icon.png"
          cp ico/default_icon.ico "$APP/Contents/Resources/icon.ico"
          chmod +x "$APP/Contents/MacOS/merger-native"
          tar -C release -czf release/merger-native-macos-amd64.tar.gz \
            "Prompt Merger Native.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: merger-native-macos-amd64
          path: release/merger-native-macos-amd64.tar.gz
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - windows-amd64
      - linux-amd64
      - macos-arm64
      - macos-amd64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" artifacts/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" artifacts/* --generate-notes
          fi
