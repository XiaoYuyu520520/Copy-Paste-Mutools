name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.25"

jobs:
  # ---------------------------------------------------------------------------
  # 静态检查 + 单元测试 + 格式检查
  # ---------------------------------------------------------------------------
  check:
    name: Vet, Test & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Fyne 通过 cgo 依赖 OpenGL / X11 / Wayland 头文件，
      # 没有这些依赖时 go vet ./... 会在编译 GUI 包时失败。
      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc libc6-dev \
            libgl1-mesa-dev xorg-dev \
            libwayland-dev libxkbcommon-dev

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未格式化，请运行 gofmt -w："
            echo "$unformatted"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Windows 原生编译（Fyne 需要 MinGW，因此用 MSYS2）
  # ---------------------------------------------------------------------------
  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build all programs
        shell: msys2 {0}
        run: |
          set -e
          export CGO_ENABLED=1
          mkdir -p /tmp/out
          go build -trimpath -o /tmp/out/merger.exe  ./cmd/merger
          go build -trimpath -o /tmp/out/toolbox.exe ./cmd/toolbox
          go build -trimpath -o /tmp/out/paint.exe   ./cmd/paint
          ls -lh /tmp/out

  # ---------------------------------------------------------------------------
  # toolbox 是纯 Go（不依赖 cgo），可以交叉编译到所有目标平台做冒烟测试
  # ---------------------------------------------------------------------------
  cross-toolbox:
    name: Cross compile toolbox (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: amd64 }
          - { os: linux,   arch: arm64 }
          - { os: windows, arch: amd64 }
          - { os: darwin,  arch: amd64 }
          - { os: darwin,  arch: arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          go build -trimpath -o /tmp/out/toolbox ./cmd/toolbox
          ls -lh /tmp/out