name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.25"

jobs:
  # ---------------------------------------------------------------------------
  # 静态检查 + 单元测试 + 格式检查
  # ---------------------------------------------------------------------------
  check:
    name: Vet, Test & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Fyne 通过 cgo 依赖 OpenGL / X11 / Wayland 头文件，
      # 没有这些依赖时 go vet ./... 会在编译 GUI 包时失败。
      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc libc6-dev \
            libgl1-mesa-dev xorg-dev \
            libwayland-dev libxkbcommon-dev

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      # 竞态检测：并发相关的改动（配置快照、扫描取消、流式刷新）必须有 race 覆盖。
      - name: go test -race（核心包）
        run: go test -race ./internal/data/... ./internal/netscan/... ./internal/lanscan/... ./internal/mobile/... ./internal/ai/... ./internal/chat/...

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未格式化，请运行 gofmt -w："
            echo "$unformatted"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # 网页版工具的浏览器冒烟测试（Playwright）
  # ---------------------------------------------------------------------------
  web:
    name: Web tools smoke (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 内联脚本语法检查需要 node；runner 自带的版本也可用，
      # 这里显式固定一个主版本，避免依赖镜像预装内容。
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      # 内联脚本语法检查：比打开浏览器快得多，失败时能直接定位到文件。
      - name: JS syntax check
        run: python tests/web/check_js_syntax.py

      - name: Run web smoke tests
        run: python tests/web/test_tools_smoke.py

  # ---------------------------------------------------------------------------
  # Windows 原生编译（Fyne 需要 MinGW，因此用 MSYS2）
  # ---------------------------------------------------------------------------
  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # path-type: inherit 才会把 MSYS2 的 bin 目录写进后续步骤的 PATH。
      # 默认的 strict 只给 msys2 shell 用，PowerShell 里看不到 gcc。
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit

      - name: Build all programs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:CGO_ENABLED = "1"
          gcc --version | Select-Object -First 1
          go version
          New-Item -ItemType Directory -Force -Path out | Out-Null
          go build -trimpath -o out/merger.exe  ./cmd/merger
          go build -trimpath -o out/toolbox.exe ./cmd/toolbox
          go build -trimpath -o out/paint.exe   ./cmd/paint
          Get-ChildItem out

  # ---------------------------------------------------------------------------
  # toolbox 是纯 Go（不依赖 cgo），可以交叉编译到所有目标平台做冒烟测试
  # ---------------------------------------------------------------------------
  cross-toolbox:
    name: Cross compile toolbox (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: amd64 }
          - { os: linux,   arch: arm64 }
          - { os: windows, arch: amd64 }
          - { os: darwin,  arch: amd64 }
          - { os: darwin,  arch: arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          go build -trimpath -o /tmp/out/toolbox ./cmd/toolbox
          ls -lh /tmp/out