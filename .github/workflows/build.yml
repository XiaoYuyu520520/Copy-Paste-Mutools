name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.25"

jobs:
  check:
    name: Vet & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请运行 gofmt -w："
            echo "$unformatted"
            exit 1
          fi

  cross-compile:
    name: Cross compile (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-latest
          - os: windows
            arch: amd64
            runner: windows-latest
          - os: darwin
            arch: amd64
            runner: macos-15-intel
          - os: darwin
            arch: arm64
            runner: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # toolbox 不依赖 cgo，可直接交叉编译。
      # merger / paint 依赖 Fyne→OpenGL，必须带 cgo，
      # 只能在对应平台的原生 runner 上构建，因此这里只做类型检查，
      # 真实构建交给 release.yml 的三个原生 runner。
      - name: Cross compile toolbox
        shell: bash
        run: |
          set -euo pipefail
          export GOOS=${{ matrix.os }}
          export GOARCH=${{ matrix.arch }}
          export CGO_ENABLED=0
          mkdir -p /tmp/cross
          go build -o /tmp/cross/toolbox ./cmd/toolbox
          ls -lh /tmp/cross

      - name: Type-check GUI programs (need cgo, cannot cross compile)
        shell: bash
        run: |
          set -euo pipefail
          export GOOS=${{ matrix.os }}
          export GOARCH=${{ matrix.arch }}
          export CGO_ENABLED=1
          # 没有交叉编译工具链时跳过；这些程序由 release.yml 原生构建。
          go vet ./cmd/merger ./cmd/paint || echo "::notice::GUI 程序需要 cgo 交叉工具链，已跳过（由 release.yml 原生构建）"
